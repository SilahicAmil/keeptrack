name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            artifact: keeptrack-windows-amd64.exe
          - name: macos
            os: macos-latest
            artifact: keeptrack-macos-arm64.dmg
          - name: linux
            os: ubuntu-latest
            artifact: keeptrack-linux-amd64.AppImage

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libfuse2

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Wails v3 CLI
        run: go install -v github.com/wailsapp/wails/v3/cmd/wails3@latest

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        run: task build

      - name: Package (macOS .app)
        if: matrix.os == 'macos-latest'
        run: task darwin:package

      - name: Package (Linux AppImage)
        if: matrix.os == 'ubuntu-latest'
        run: task linux:create:appimage

      - name: Install create-dmg
        if: matrix.os == 'macos-latest'
        run: brew install create-dmg

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          case "${{ matrix.os }}" in
            windows-latest)
              cp bin/keeptrack.exe "dist/${{ matrix.artifact }}"
              ;;
            macos-latest)
              codesign --force --deep --sign - bin/keeptrack.app
              codesign --verify --deep --strict bin/keeptrack.app
              create-dmg \
                --volname "keeptrack" \
                --window-pos 200 120 \
                --window-size 600 400 \
                --icon-size 100 \
                --icon "keeptrack.app" 175 190 \
                --hide-extension "keeptrack.app" \
                --app-drop-link 425 190 \
                "dist/${{ matrix.artifact }}" \
                "bin/keeptrack.app"
              ;;
            ubuntu-latest)
              cp bin/*.AppImage "dist/${{ matrix.artifact }}"
              ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: true
          generate_release_notes: true
